# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel = true

# 为 Studio 分配默认的内存大小
# JDK 17 需要这些参数
org.gradle.jvmargs = -Xmx2048m -Dfile.encoding=UTF-8 \
    --add-opens=java.base/java.io=ALL-UNNAMED \
    --add-opens=java.base/java.lang=ALL-UNNAMED \
    --add-opens=java.base/java.util=ALL-UNNAMED \
    --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
    --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
# 指定 Gradle 使用的 JDK 版本（Gradle 7.4 + AGP 7.0.4 需要 JDK 11+）
org.gradle.java.home=D:/toolkit/Java/jdk-11
# 表示使用 AndroidX
android.useAndroidX = true
# 表示将第三方库迁移到 AndroidX
android.enableJetifier = true

# 规避 Android Studio 传入的失效 HTTP 代理：AS 曾把代理设成已关闭的 127.0.0.1:7897，
# 且会把它作为 -Dhttp.proxyHost/-Dhttp.proxyPort 传给 Gradle，导致所有依赖下载失败。
# 这里让 Gradle 对所有主机都绕过代理（直连），不受 IDE 代理设置影响。
systemProp.http.nonProxyHosts=*
systemProp.https.nonProxyHosts=*